<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文法学習アプリ</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --success-color: #10b981;
      --error-color: #ef4444;
      --warning-color: #f59e0b;
      --warning-hover: #d97706;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      margin-bottom: 16px;
    }

    .hidden {
      display: none !important;
    }

    h1, h2, h3 {
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 16px;
    }

    h1 { font-size: 1.5rem; text-align: center; }
    h2 { font-size: 1.25rem; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    .status-container {
      background-color: #f9fafb;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .progress-bar {
      background: #e5e7eb;
      border-radius: 9999px;
      height: 12px;
      width: 100%;
      overflow: hidden;
    }

    .progress-fill {
      background: var(--success-color);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }
    .btn-primary:hover:not(:disabled) { background-color: var(--primary-hover); }

    .btn-warning {
      background-color: var(--warning-color);
      color: white;
    }
    .btn-warning:hover:not(:disabled) { background-color: var(--warning-hover); }

    .btn-secondary {
      background-color: #e5e7eb;
      color: var(--text-main);
    }
    .btn-secondary:hover:not(:disabled) { background-color: #d1d5db; }

    /* クイズ画面固有 */
    .quiz-info {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .question-box {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
      min-height: 60px;
    }

    .feedback {
      margin: 16px 0;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      text-align: center;
      font-size: 1rem;
    }

    .feedback.correct {
      background-color: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .feedback.incorrect {
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 600;
      color: var(--primary-color);
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- ローディング表示 -->
    <div id="loading" class="loading-overlay">データを読み込み中...</div>

    <!-- ホーム画面 -->
    <div id="home-screen" class="card">
      <h1>文法学習アプリ</h1>
      
      <div class="form-group">
        <label for="grammar-select">文法カテゴリ</label>
        <select id="grammar-select" onchange="updateStatusDisplay()">
          <option value="ALL">すべて</option>
        </select>
      </div>

      <div class="form-group">
        <label for="level-select">レベル</label>
        <select id="level-select" onchange="updateStatusDisplay()">
          <option value="ALL">すべて</option>
        </select>
      </div>

      <!-- 達成状況表示 -->
      <div class="status-container">
        <div class="status-header">
          <span>達成状況</span>
          <span id="status-text">0 / 0 問 (0%)</span>
        </div>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-primary" onclick="startLearning()">学習を開始する</button>
        <button class="btn-warning" onclick="handleReset()">選択条件の進捗をリセット</button>
      </div>
    </div>

    <!-- 学習画面 -->
    <div id="quiz-screen" class="card hidden">
      <div class="quiz-info">
        <span id="quiz-category">文法 - Level 1</span>
        <span id="quiz-progress">1 / 10 問</span>
      </div>

      <div class="question-box" id="question-text">
        問題文がここに表示されます。
      </div>

      <div class="form-group">
        <input type="text" id="user-answer" placeholder="解答を入力..." autocomplete="off">
      </div>

      <div id="feedback" class="feedback hidden"></div>

      <div class="btn-group">
        <button id="submit-btn" class="btn-primary" onclick="checkAnswer()">回答する</button>
        <button id="next-btn" class="btn-primary hidden" onclick="nextQuestion()">次の問題へ</button>
        <button class="btn-secondary" onclick="backToHome()">ホームに戻る</button>
      </div>
    </div>
  </div>

  <script>
    let homeData = null;
    let currentQuestions = [];
    let currentIndex = 0;

    // 初期化（ページロード時）
    window.onload = function() {
      fetchHomeData();
    };

    function showLoading(msg = '処理中...') {
      const loader = document.getElementById('loading');
      loader.innerText = msg;
      loader.classList.remove('hidden');
    }

    function hideLoading() {
      document.getElementById('loading').classList.add('hidden');
    }

    // データ取得
    function fetchHomeData() {
      showLoading('データを読み込み中...');
      google.script.run
        .withSuccessHandler(initHome)
        .withFailureHandler(handleError)
        .getHomeData();
    }

    function initHome(data) {
      homeData = data;
      const gSelect = document.getElementById('grammar-select');
      const lSelect = document.getElementById('level-select');

      // 選択肢の初期化
      gSelect.innerHTML = '<option value="ALL">すべて</option>';
      lSelect.innerHTML = '<option value="ALL">すべて</option>';

      if (data.grammars) {
        data.grammars.forEach(g => gSelect.add(new Option(g, g)));
      }
      if (data.levels) {
        data.levels.forEach(l => lSelect.add(new Option('Level ' + l, l)));
      }

      updateStatusDisplay();
      hideLoading();
    }

    // 達成状況の表示更新
    function updateStatusDisplay() {
      if (!homeData || !homeData.stats) return;

      const selectedG = document.getElementById('grammar-select').value;
      const selectedL = document.getElementById('level-select').value;

      let total = 0;
      let cleared = 0;

      Object.keys(homeData.stats).forEach(key => {
        const parts = key.split('_');
        const g = parts[0];
        const l = parts[1];

        const matchG = (selectedG === 'ALL' || g === selectedG);
        const matchL = (selectedL === 'ALL' || String(l) === String(selectedL));

        if (matchG && matchL) {
          total += homeData.stats[key].total || 0;
          cleared += homeData.stats[key].cleared || 0;
        }
      });

      const percent = total > 0 ? Math.round((cleared / total) * 100) : 0;
      document.getElementById('status-text').innerText = `${cleared} / ${total} 問完了 (${percent}%)`;
      document.getElementById('progress-fill').style.width = percent + '%';
    }

    // 学習開始
    function startLearning() {
      const g = document.getElementById('grammar-select').value;
      const l = document.getElementById('level-select').value;

      showLoading('問題を準備中...');
      google.script.run
        .withSuccessHandler(setupQuiz)
        .withFailureHandler(handleError)
        .getQuestions(g, l);
    }

    function setupQuiz(questions) {
      hideLoading();
      if (!questions || questions.length === 0) {
        alert('該当する未正解の問題がありません。すべての問題をクリアしているか、条件を変更してください。');
        return;
      }

      currentQuestions = questions;
      currentIndex = 0;

      document.getElementById('home-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      
      showQuestion();
    }

    function showQuestion() {
      if (currentIndex >= currentQuestions.length) {
        alert('このセットの未正解問題がすべて終了しました！');
        backToHome();
        return;
      }

      const q = currentQuestions[currentIndex];
      
      document.getElementById('quiz-category').innerText = `${q.grammar} - Level ${q.level}`;
      document.getElementById('quiz-progress').innerText = `${currentIndex + 1} / ${currentQuestions.length} 問`;
      document.getElementById('question-text').innerText = q.question;
      
      const answerInput = document.getElementById('user-answer');
      answerInput.value = '';
      answerInput.disabled = false;
      answerInput.focus();

      const feedback = document.getElementById('feedback');
      feedback.className = 'feedback hidden';
      feedback.innerText = '';

      document.getElementById('submit-btn').classList.remove('hidden');
      document.getElementById('next-btn').classList.add('hidden');
    }

    function checkAnswer() {
      const answerInput = document.getElementById('user-answer');
      const userAns = answerInput.value.trim();
      
      if (!userAns) {
        alert('解答を入力してください。');
        return;
      }

      const q = currentQuestions[currentIndex];
      const feedback = document.getElementById('feedback');

      answerInput.disabled = true;
      document.getElementById('submit-btn').classList.add('hidden');

      if (userAns.toLowerCase() === String(q.answer).trim().toLowerCase()) {
        feedback.innerText = '⭕ 正解！';
        feedback.className = 'feedback correct';
        
        // Google Apps Script側のクリア処理（非同期で実行）
        google.script.run.markAsCleared(q.id);
      } else {
        feedback.innerText = `❌ 不正解... (正解: ${q.answer})`;
        feedback.className = 'feedback incorrect';
        
        // 間違えた問題を配列の末尾に追加して、正解するまで繰り返し出題
        currentQuestions.push(q);
      }

      document.getElementById('next-btn').classList.remove('hidden');
      document.getElementById('next-btn').focus();
    }

    function nextQuestion() {
      currentIndex++;
      showQuestion();
    }

    function backToHome() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('home-screen').classList.remove('hidden');
      fetchHomeData(); // 最新の達成状況を再読み込み
    }

    function handleReset() {
      const g = document.getElementById('grammar-select').value;
      const l = document.getElementById('level-select').value;

      const gText = g === 'ALL' ? 'すべて' : g;
      const lText = l === 'ALL' ? 'すべて' : 'Level ' + l;

      if (confirm(`選択中の条件（文法: ${gText}, レベル: ${lText}）の進捗をリセットしますか？`)) {
        showLoading('リセット中...');
        google.script.run
          .withSuccessHandler(() => {
            hideLoading();
            alert('進捗をリセットしました。');
            fetchHomeData();
          })
          .withFailureHandler(handleError)
          .resetProgress(g, l);
      }
    }

    function handleError(err) {
      hideLoading();
      alert('エラーが発生しました: ' + (err.message || err));
    }

    // Enterキーでの回答/次へ操作
    document.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        const quizScreen = document.getElementById('quiz-screen');
        if (!quizScreen.classList.contains('hidden')) {
          const submitBtn = document.getElementById('submit-btn');
          const nextBtn = document.getElementById('next-btn');

          if (!submitBtn.classList.contains('hidden')) {
            checkAnswer();
          } else if (!nextBtn.classList.contains('hidden')) {
            nextQuestion();
          }
        }
      }
    });
  </script>
</body>
</html>
